// Top-level build file where you can add configuration options common to all sub-projects/modules.

// 依赖源：本机在 Gradle 里直连 dl.google.com / repo.maven.apache.org 会 TLS 握手失败
// （Remote host terminated the handshake，而 curl 正常）。镜像一律排在官方之前，
// 镜像缺件时才回落到官方仓库。
//
// 注意：capacitor-android 与 capacitor-cordova-android-plugins 两个子工程各自声明了
// buildscript 仓库（前者在 node_modules 里、后者由 cap sync 生成，都不能改），
// 所以必须用 allprojects { buildscript { ... } } 把镜像提前插进它们的 classpath 解析 ——
// 否则它们的 AGP classpath 会直连 dl.google.com 而失败。这个坑只在冷缓存全量构建时暴露。

def cnMavenMirrors = [
    'https://maven.aliyun.com/repository/google',
    'https://maven.aliyun.com/repository/public',
    'https://maven.aliyun.com/repository/gradle-plugin',
    'https://mirrors.cloud.tencent.com/nexus/repository/maven-public'
]

buildscript {

    repositories {
        // 这几条不能引用上面的 cnMavenMirrors：buildscript 块先于脚本主体求值
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
            google()
            mavenCentral()
        }
    }
    repositories {
        cnMavenMirrors.each { m -> maven { url m } }
        google()
        mavenCentral()
    }
}

apply from: "variables.gradle"

task clean(type: Delete) {
    delete rootProject.buildDir
}
